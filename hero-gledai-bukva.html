<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOISY · Хиро Гледай · Буква</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html{background:#0a090d}body{margin:0;background:#0a090d;font-family:'Manrope',sans-serif;color:#fff}
.nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:32px 96px;box-sizing:border-box}
.logo{position:relative;flex:none;width:199px;height:48px;display:block}
.logo .glow{position:absolute;left:-27px;top:-13px;width:253px;height:72px;border-radius:104px;background:rgba(0,0,0,.16);filter:blur(20px)}
.logo img{position:relative;display:block;width:199px;height:48px}
.menu{display:flex;align-items:center;gap:32px;padding:16px 32px;border-radius:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(178.59deg,rgba(0,2,112,.1) 0%,rgba(0,2,112,.02) 50%,rgba(0,2,112,.06) 100%),rgba(0,0,0,.5)}
.menu ul{display:flex;align-items:center;gap:60px;margin:0;padding:0 16px 0 0;list-style:none}
.menu a{font-family:'Manrope',sans-serif;font-weight:400;font-size:16px;line-height:normal;letter-spacing:.25px;color:#fff;text-decoration:none;white-space:nowrap;opacity:.5;transition:opacity .2s ease}
.menu a:hover,.menu a.on{opacity:1}
.cta{display:flex;align-items:center;justify-content:center;width:149px;height:44px;border:0;border-radius:8px;padding:0;font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#8C18BE 0%,#A01076 33%,#C20406 100%)}
.burger{display:none;width:44px;height:44px;border:0;padding:0;background:transparent;color:#fff;cursor:pointer;align-items:center;justify-content:center}
.sub{margin:0;font-family:'Manrope',sans-serif;font-weight:400;font-size:19px;line-height:1.4;color:rgba(255,255,255,.85);animation:up 1s .6s cubic-bezier(.16,1,.3,1) both}
.cta-hero{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#fff;border:0;border-radius:12px;padding:16px 28px;min-height:52px;background:linear-gradient(90deg,#B61DFF,#FF0000);cursor:pointer}
.note{font-size:16px;color:rgba(255,255,255,.8)}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes vcyc{0%{opacity:0}3%,19%{opacity:1}24%,100%{opacity:0}}
@media (max-width:1180px){.nav{padding:24px 32px}.menu ul{gap:32px}}
@media (max-width:900px){.nav{padding:16px}.menu{display:none}.burger{display:flex}.logo,.logo img{width:133px;height:32px}.logo .glow{left:-18px;top:-9px;width:169px;height:50px}.bl,.br{width:18%}}
.page{position:relative;width:100%;background:#0a090d;overflow:clip}
.pin{position:relative}
.stage{position:sticky;top:0;height:100vh;min-height:640px;overflow:hidden;isolation:isolate;background:#050407}
.wfin{position:absolute;left:0;right:0;top:19vh;z-index:7;text-align:center;opacity:0;pointer-events:none;padding:0 20px}
.wfin::before{content:"";position:absolute;left:0;right:0;top:-19vh;height:60vh;z-index:-1;background:linear-gradient(180deg,rgba(5,4,7,.78),rgba(5,4,7,.45) 55%,rgba(5,4,7,0))}
.wfin h2{margin:0 0 20px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(24px,3.6vw,52px);line-height:1.1;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(8,7,11,.7)}
.after{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:90px 20px 110px;text-align:center;background:#0a090d}
.after h2{margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(22px,3vw,40px);letter-spacing:-.02em}
.after .row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.nav{z-index:9}
.cta-hero{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#fff;border:0;border-radius:12px;padding:16px 28px;min-height:52px;background:linear-gradient(90deg,#B61DFF,#FF0000);cursor:pointer}
@keyframes cyc2{0%{opacity:0}3%,18%{opacity:1}22%,100%{opacity:0}}
@keyframes vcyc{0%{opacity:0}3%,19%{opacity:1}24%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.page *{animation:none!important}}

.pin{height:230vh}
.stage{background:#050407}
.bloom{position:absolute;inset:-10%;z-index:0;background:radial-gradient(34% 40% at 24% 62%,rgba(182,29,255,.38),transparent 70%),radial-gradient(30% 36% at 78% 38%,rgba(255,0,0,.30),transparent 70%),radial-gradient(36% 30% at 52% 88%,rgba(206,19,168,.28),transparent 70%);animation:bl 18s ease-in-out infinite alternate}
@keyframes bl{from{transform:translate3d(-2%,1%,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.08)}}
.g{position:absolute;inset:0;z-index:2;isolation:isolate;mix-blend-mode:screen}
.vs{position:absolute;inset:0}
.vs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:vcyc 20s ease-in-out infinite both}
.ov{position:absolute;inset:0;background:#050407;mix-blend-mode:multiply;will-change:transform,opacity;transform-origin:50% 46%}
.bw{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);white-space:nowrap;opacity:0;color:#fff;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(46px,min(16vw,30vh),300px);line-height:1;letter-spacing:-.045em;animation:cyc2 20s ease-in-out infinite both}
.lab{position:absolute;left:0;right:0;top:calc(46% - clamp(46px,min(16vw,30vh),300px)*.62 - 40px);z-index:5;text-align:center;font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(18px,2.3vw,34px);letter-spacing:.02em;text-shadow:0 2px 18px rgba(5,4,7,.6)}
.low{position:absolute;left:0;right:0;bottom:7vh;z-index:5;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 20px;text-align:center}
.low .sub{margin:0;font-size:clamp(16px,1.4vw,19px)}
.low .acts{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
</style></head><body>
<div class="page"><div class="pin" id="pin"><section class="stage" aria-label="Гледай спорт, реалити, филми, сериали, новини">
<div class="bloom" aria-hidden="true"></div>
<div class="g" aria-hidden="true"><div class="vs"><video src="vid/gl/hd/lev-goal.mp4" muted loop autoplay playsinline preload="auto" style="animation-delay:0.4s"></video><video src="vid/gl/hd/igri-b.mp4" muted loop autoplay playsinline preload="auto" style="animation-delay:4.4s"></video><video src="vid/gl/hd/dune.mp4" muted loop autoplay playsinline preload="auto" style="animation-delay:8.4s"></video><video src="vid/gl/hd/hotd.mp4" muted loop autoplay playsinline preload="auto" style="animation-delay:12.4s"></video><video src="vid/gl/hd/newsroom.mp4" muted loop autoplay playsinline preload="auto" style="animation-delay:16.4s"></video></div><div class="ov" id="ov"><span class="bw" style="animation-delay:0.4s">спорт</span><span class="bw" style="animation-delay:4.4s">реалити</span><span class="bw" style="animation-delay:8.4s">филми</span><span class="bw" style="animation-delay:12.4s">сериали</span><span class="bw" style="animation-delay:16.4s">новини</span></div></div>

<script>
(function(){
function clamp(v){return Math.max(0,Math.min(1,v))}
function ease(x){return x*x*(3-2*x)}
var pin=document.getElementById("pin");
function prog(){var r=pin.getBoundingClientRect(),range=pin.offsetHeight-innerHeight;return clamp(-r.top/range)}
var tick=0;function onS(){if(!tick)tick=requestAnimationFrame(function(){tick=0;update()})}
addEventListener("scroll",onS,{passive:true});addEventListener("resize",onS);

var ov=document.getElementById("ov"),lab=document.getElementById("lab"),low=document.getElementById("low"),wfin=document.getElementById("wfin");
function update(){
 var p=prog(),z=clamp(p/.78),s=Math.pow(26,ease(z));
 ov.style.transform="scale("+s+")";
 ov.style.opacity=1-ease(clamp((p-.30)/.42));
 var f=clamp(p/.12);lab.style.opacity=1-f;low.style.opacity=1-f;low.style.pointerEvents=f>.5?"none":"auto";
 var w=clamp((p-.84)/.12);wfin.style.opacity=w;wfin.style.pointerEvents=w>.5?"auto":"none";
}
update();
})();
</script></body></html>
