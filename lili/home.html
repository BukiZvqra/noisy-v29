<style>
/* Карусел „Повече от гледане“ с мокъпите от Figma (страница mPage, Frame 4 → Frame 14 на Лили).
   Всяка карта е 1260×612 в мерките на Figma; устройството тръгва от позицията във Frame 4 и се свива до Frame 14 (Apple ефектът). */
:root{--bg:#0A090D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#f5f5f7;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.back{position:fixed;left:16px;top:12px;z-index:20;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:980px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px;font-weight:600;color:#f5f5f7;text-decoration:none}
.sec{padding:110px 0 90px}
.h{margin:0 0 36px;padding:0 var(--m);font:600 clamp(28px,3.4vw,48px)/1.1 Unbounded,Manrope,sans-serif;letter-spacing:-.02em}
.sec{--W:min(1260px,calc(100vw - 160px));--m:calc((100vw - var(--W)) / 2)}
@media (max-width:734px){.sec{--W:calc(100vw - 40px)}}
.rail{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--m) 8px;scrollbar-width:none;scroll-padding:0 var(--m)}
.rail::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:var(--W);aspect-ratio:1260/612;border-radius:28px;overflow:hidden;scroll-snap-align:start;background:linear-gradient(180deg,#2b2b2b 0%,#1e1e1e 100%)}
.st{position:absolute;left:0;top:0;width:1260px;height:612px;transform-origin:0 0;transform:scale(var(--k,1))}
/* текстът: значката на модула + изречението, на мястото от Figma */
.tx{position:absolute;z-index:4;opacity:0;transform:translateY(30px);transition:opacity 1s ease .25s,transform 1s cubic-bezier(.25,.1,.25,1) .25s}
.card.on .tx{opacity:1;transform:none}
.tx img{display:block;height:40px;width:auto;margin-bottom:14px}
.tx p{margin:0;font:600 36px/1.17 Manrope,system-ui,sans-serif;letter-spacing:-.01em;color:#fff}
/* устройството: крайната позиция е Frame 14; началната (Frame 4) е в --s, --dx, --dy */
.dv{position:absolute;z-index:2;transform-origin:0 0;transform:translate(var(--dx),var(--dy)) scale(var(--s));transition:transform 1.8s cubic-bezier(.33,0,.15,1)}
.card.on .dv{transform:none}
.dv>img{display:block;width:100%;height:100%}
.scr{position:absolute;overflow:hidden;background:#000}
.scr video,.scr img{display:block;width:100%;height:100%;object-fit:cover}
.isl{position:absolute;z-index:2;background:#000;border-radius:20px}
.full{position:absolute;inset:0}
.full video{width:100%;height:100%;object-fit:cover;filter:brightness(.6)}
.ctl{display:flex;justify-content:center;gap:10px;margin-top:28px}
.ctl button{width:44px;height:44px;border-radius:50%;border:0;background:#3a3a3c;color:#fff;font-size:20px;cursor:pointer}
.ctl button:disabled{opacity:.35;cursor:default}
.dots{display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:980px;background:#3a3a3c}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:width .3s,background .3s}
.dots i.on{width:28px;border-radius:4px;background:#fff}
@media (prefers-reduced-motion:reduce){.dv,.tx{transition:none}}
/* „Прескочи до момента“ от v23 (същият фийчър), в екрана на телефона в ръката */
.jp{--out:cubic-bezier(.16,1,.3,1);--mute:rgba(255,255,255,.6);background:#141317}
.jpw{position:absolute;left:0;top:0;width:300px;height:632px;transform:scale(.847);transform-origin:0 0;display:flex;flex-direction:column;color:#fff;font-family:Manrope,system-ui,sans-serif}
/* Прескочи до момента: маркерите по лентата на плейъра (емоджи) и списъкът с моментите; подсказката е като „Time hints“ от Figma */
.jpw{background:#141317;display:flex;flex-direction:column}
.jv{position:relative;margin-top:12%;aspect-ratio:16/9;background:#000;flex:none}
.jv video{width:100%;height:100%;object-fit:cover;display:block}
.jsb{position:absolute;left:6%;right:6%;bottom:12px;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}
.jfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:#fff}
.jm{appearance:none;border:0;position:absolute;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;line-height:36px!important;padding:0;border-radius:50%;background:rgba(10,9,13,.75);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);font-size:14px;line-height:30px;cursor:pointer;transition:transform .3s var(--out),box-shadow .3s}
.jm.on{transform:scale(1.25);box-shadow:inset 0 0 0 2px #fff,0 0 0 4px rgba(206,19,168,.5)}
.jtm{position:absolute;bottom:22px;transform:translateX(-50%);padding:4px 8px;border-radius:7px;background:#fff;color:#111;font-size:11px;font-weight:700;white-space:nowrap;transition:left .5s cubic-bezier(.16,1,.3,1)}
.jtm::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:8px;background:#fff}
.jhd{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 10px 0;font-size:13px}
.jhd .num{font-size:22px}
.jhd b{font-size:17px}
.jhd span{color:var(--mute);font-size:13px}
.jlb{margin:8px 12px 6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.jl{display:flex;flex-direction:column;gap:4px;padding:0 8px}
.jr{appearance:none;border:0;display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.04);color:#fff;font:inherit;font-size:13px;text-align:left;cursor:pointer;transition:background .3s}
.jr .e{font-size:16px}
.jr .n{flex:1}
.jr .m{font-weight:800;color:var(--mute)}
.jr.on{background:rgba(206,19,168,.2);box-shadow:inset 0 0 0 1px rgba(206,19,168,.6)}
.jr.on .m{color:#FF5FC4}
/* devices.css слага display:block на всичко в рамката; връщаме разположението на екрана „Моментите“ */
.phone.dvc .jhd{display:flex}
.phone.dvc .jl{display:flex}
.phone.dvc .jr{display:flex}
.phone.dvc .jr .e,.phone.dvc .jr .n,.phone.dvc .jr .m{display:block}
.phone.dvc .jv{display:block}
.phone.dvc .jsb{display:block}
.phone.dvc .jm{display:flex;align-items:center;justify-content:center}
.ppl button,.jm{min-width:44px!important;min-height:44px!important}
.jr{min-height:44px!important}
.jhd span,.jtm,.jl .m,.jlb{font-size:15px!important}
.jm{width:44px!important;height:44px!important}
</style>
