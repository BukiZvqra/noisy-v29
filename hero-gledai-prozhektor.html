<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOISY · Хиро Гледай · Прожектор</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html{background:#0a090d}body{margin:0;background:#0a090d;font-family:'Manrope',sans-serif;color:#fff}
.nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:32px 96px;box-sizing:border-box}
.logo{position:relative;flex:none;width:199px;height:48px;display:block}
.logo .glow{position:absolute;left:-27px;top:-13px;width:253px;height:72px;border-radius:104px;background:rgba(0,0,0,.16);filter:blur(20px)}
.logo img{position:relative;display:block;width:199px;height:48px}
.menu{display:flex;align-items:center;gap:32px;padding:16px 32px;border-radius:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(178.59deg,rgba(0,2,112,.1) 0%,rgba(0,2,112,.02) 50%,rgba(0,2,112,.06) 100%),rgba(0,0,0,.5)}
.menu ul{display:flex;align-items:center;gap:60px;margin:0;padding:0 16px 0 0;list-style:none}
.menu a{font-family:'Manrope',sans-serif;font-weight:400;font-size:16px;line-height:normal;letter-spacing:.25px;color:#fff;text-decoration:none;white-space:nowrap;opacity:.5;transition:opacity .2s ease}
.menu a:hover,.menu a.on{opacity:1}
.cta{display:flex;align-items:center;justify-content:center;width:149px;height:44px;border:0;border-radius:8px;padding:0;font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#8C18BE 0%,#A01076 33%,#C20406 100%)}
.burger{display:none;width:44px;height:44px;border:0;padding:0;background:transparent;color:#fff;cursor:pointer;align-items:center;justify-content:center}
.sub{margin:0;font-family:'Manrope',sans-serif;font-weight:400;font-size:19px;line-height:1.4;color:rgba(255,255,255,.85);animation:up 1s .6s cubic-bezier(.16,1,.3,1) both}
.cta-hero{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#fff;border:0;border-radius:12px;padding:16px 28px;min-height:52px;background:linear-gradient(90deg,#B61DFF,#FF0000);cursor:pointer}
.note{font-size:16px;color:rgba(255,255,255,.8)}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes vcyc{0%{opacity:0}3%,19%{opacity:1}24%,100%{opacity:0}}
@media (max-width:1180px){.nav{padding:24px 32px}.menu ul{gap:32px}}
@media (max-width:900px){.nav{padding:16px}.menu{display:none}.burger{display:flex}.logo,.logo img{width:133px;height:32px}.logo .glow{left:-18px;top:-9px;width:169px;height:50px}.bl,.br{width:18%}}
.page{position:relative;width:100%;background:#0a090d;overflow:clip}
.pin{position:relative}
.stage{position:sticky;top:0;height:100vh;min-height:640px;overflow:hidden;isolation:isolate;background:#050407}
.wfin{position:absolute;left:0;right:0;top:19vh;z-index:7;text-align:center;opacity:0;pointer-events:none;padding:0 20px}
.wfin::before{content:"";position:absolute;left:0;right:0;top:-19vh;height:60vh;z-index:-1;background:linear-gradient(180deg,rgba(5,4,7,.78),rgba(5,4,7,.45) 55%,rgba(5,4,7,0))}
.wfin h2{margin:0 0 20px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(24px,3.6vw,52px);line-height:1.1;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(8,7,11,.7)}
.after{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:90px 20px 110px;text-align:center;background:#0a090d}
.after h2{margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(22px,3vw,40px);letter-spacing:-.02em}
.after .row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.nav{z-index:9}
.cta-hero{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;color:#fff;border:0;border-radius:12px;padding:16px 28px;min-height:52px;background:linear-gradient(90deg,#B61DFF,#FF0000);cursor:pointer}
@keyframes cyc2{0%{opacity:0}3%,18%{opacity:1}22%,100%{opacity:0}}
@keyframes vcyc{0%{opacity:0}3%,19%{opacity:1}24%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.page *{animation:none!important}}

.pin{height:230vh}
.stage{background:#040306;--r:26vmax;--mx:50%;--my:42%}
.vs{position:absolute;inset:0;z-index:1;-webkit-mask-image:radial-gradient(circle var(--r) at var(--mx) var(--my),#000 0,#000 28%,rgba(0,0,0,.09) 100%);mask-image:radial-gradient(circle var(--r) at var(--mx) var(--my),#000 0,#000 28%,rgba(0,0,0,.09) 100%)}
.vs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:brightness(.9) saturate(1.05);animation:vcyc 20s ease-in-out infinite both}
.vs video:nth-child(1){animation-delay:.4s}.vs video:nth-child(2){animation-delay:4.4s}.vs video:nth-child(3){animation-delay:8.4s}.vs video:nth-child(4){animation-delay:12.4s}.vs video:nth-child(5){animation-delay:16.4s}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.16;mix-blend-mode:overlay}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-52%);z-index:5;text-align:center;padding:0 20px}
.hero h1{margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(34px,min(7vw,13vh),104px);line-height:1.04;letter-spacing:-.03em;text-shadow:0 3px 34px rgba(4,3,6,.7)}
.l1{display:block}
.rot{position:relative;display:block;height:1.24em}
.w{position:absolute;left:0;right:0;top:0;white-space:nowrap;opacity:0;animation:cyc 20s cubic-bezier(.16,1,.3,1) infinite both}
.w>span{background:linear-gradient(90deg,#fff,#E9C9FF 60%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.w:nth-child(1){animation-delay:.4s}.w:nth-child(2){animation-delay:4.4s}.w:nth-child(3){animation-delay:8.4s}.w:nth-child(4){animation-delay:12.4s}.w:nth-child(5){animation-delay:16.4s}
@keyframes cyc{0%{opacity:0;transform:translateY(.45em)}3%{opacity:1;transform:none}18%{opacity:1;transform:none}21%{opacity:0;transform:translateY(-.45em)}100%{opacity:0;transform:translateY(-.45em)}}
.hero .sub{margin:12px auto 0;max-width:46ch;font-size:clamp(16px,1.4vw,19px)}
.hero .acts{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:20px;pointer-events:auto}
@media(prefers-reduced-motion:reduce){.w:first-child{opacity:1}}
</style></head><body>
<div class="page"><div class="pin" id="pin"><section class="stage" id="stage" aria-label="Гледай спорт, реалити, филми, сериали, новини">
<div class="vs" id="vs" aria-hidden="true"><video src="vid/gl/hd/lev-goal.mp4" muted loop autoplay playsinline preload="auto"></video><video src="vid/gl/hd/igri-b.mp4" muted loop autoplay playsinline preload="auto"></video><video src="vid/gl/hd/dune.mp4" muted loop autoplay playsinline preload="auto"></video><video src="vid/gl/hd/hotd.mp4" muted loop autoplay playsinline preload="auto"></video><video src="vid/gl/hd/newsroom.mp4" muted loop autoplay playsinline preload="auto"></video></div>
<svg class="grain" width="100%" height="100%" aria-hidden="true"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#nz)"/></svg>
<header class="nav">
<a class="logo" href="#" aria-label="NOISY начало"><span class="glow" aria-hidden="true"></span><img src="assets/logo.svg" alt="NOISY"></a>
<nav class="menu" aria-label="Основна навигация">

</nav>
<button class="burger" type="button" aria-label="Отвори менюто"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"></path></svg></button>
</header>
<div class="hero" id="hero"><h1><span class="l1">Гледай</span><span class="rot"><span class="w"><span>спорт</span></span><span class="w"><span>реалити</span></span><span class="w"><span>филми</span></span><span class="w"><span>сериали</span></span><span class="w"><span>новини</span></span></span></h1><p class="sub">Стрийминг със сериали, реалити, спорт и новини.</p><div class="acts"><button class="cta-hero" type="button">Пробвай NOISY</button><span class="note">Без карта.</span></div></div>
<div class="wfin" id="wfin"><h2>Всичко за гледане на едно място</h2><button class="cta-hero" type="button">Пробвай NOISY</button></div>
</section></div><section class="after"><h2>Всичко за гледане на едно място</h2><div class="row"><button class="cta-hero" type="button">Пробвай NOISY</button><span class="note">Без карта.</span></div></section></div>
<script>
(function(){
function clamp(v){return Math.max(0,Math.min(1,v))}
function ease(x){return x*x*(3-2*x)}
var pin=document.getElementById("pin");
function prog(){var r=pin.getBoundingClientRect(),range=pin.offsetHeight-innerHeight;return clamp(-r.top/range)}
var tick=0;function onS(){if(!tick)tick=requestAnimationFrame(function(){tick=0;update()})}
addEventListener("scroll",onS,{passive:true});addEventListener("resize",onS);

var st=document.getElementById("stage"),hero=document.getElementById("hero"),wfin=document.getElementById("wfin"),vs=document.getElementById("vs");
var still=matchMedia("(prefers-reduced-motion:reduce)").matches;
var tx=.5,ty=.42,cx=.5,cy=.42,hasPtr=false,tt=0,p=0;
st.addEventListener("pointermove",function(e){if(e.pointerType==="touch")return;var b=st.getBoundingClientRect();tx=(e.clientX-b.left)/b.width;ty=(e.clientY-b.top)/b.height;hasPtr=true},{passive:true});
st.addEventListener("pointerleave",function(){hasPtr=false});
function frame(t){
 if(!hasPtr&&!still){var s=t/1000;tx=.5+Math.cos(s*.42)*.24;ty=.46+Math.sin(s*.57)*.16}
 cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;
 st.style.setProperty("--mx",(cx*100)+"%");st.style.setProperty("--my",(cy*100)+"%");
 requestAnimationFrame(frame)
}
function update(){
 p=prog();var e=ease(clamp(p/.8));
 st.style.setProperty("--r",(26+e*150)+"vmax");
 hero.style.opacity=1-clamp((p-.04)/.16);hero.style.pointerEvents=p<.1?"auto":"none";
 vs.style.webkitMaskImage=vs.style.maskImage=p>=.9?"none":"";
 var w=clamp((p-.84)/.12);wfin.style.opacity=w;wfin.style.pointerEvents=w>.5?"auto":"none";
}
update();requestAnimationFrame(frame);
})();
</script></body></html>
